name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # publish releases with the APK (direct download link, no login needed)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Version
        id: ver
        run: echo "name=0.2.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee build.log
      - name: Release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Verify signature
        run: |
          AS=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          OUT=$("$AS" verify --print-certs app/build/outputs/apk/release/app-release.apk)
          FP=$(echo "$OUT" | grep -i "certificate SHA-256 digest" | head -1 | awk '{print $NF}')
          echo "::notice::APK signer SHA-256 $FP"
          [ "$FP" = "6247771329cd27742d32910f6e44fba6b6570cf9ff3655e3247ea21b24e8b388" ] || { echo "::error::APK is not signed with the release key"; exit 1; }
      - name: Name APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/360PhotoCap-v${{ steps.ver.outputs.name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk dist/360PhotoCap.apk
      - name: Report results
        if: always()
        run: |
          grep -E "^e: " build.log | head -10 | sed 's/^/::error::/' || true
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              root = ET.parse(f).getroot()
              for tc in root.iter('testcase'):
                  for fl in list(tc.iter('failure')) + list(tc.iter('error')):
                      msg = (fl.get('message') or fl.text or '')[:600].replace('\n', ' ')
                      print(f"::error title={tc.get('name')}::{msg}")
              for so in root.iter('system-out'):
                  for line in (so.text or '').splitlines():
                      if line.startswith('STAT'):
                          print(f"::notice::{line}")
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: 360PhotoCap-v${{ steps.ver.outputs.name }}
          path: dist/360PhotoCap-v${{ steps.ver.outputs.name }}.apk
      - name: Release
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: v${{ steps.ver.outputs.name }}
          body: ${{ github.event.head_commit.message }}
          files: |
            dist/360PhotoCap-v${{ steps.ver.outputs.name }}.apk
            dist/360PhotoCap.apk
