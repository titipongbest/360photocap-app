name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # publish releases with the APK (direct download link, no login needed)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Version
        id: ver
        run: echo "name=0.2.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee build.log
      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease
      - name: Name APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/360PhotoCap-v${{ steps.ver.outputs.name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk dist/360PhotoCap.apk
      - name: Report results
        if: always()
        run: |
          grep -E "^e: " build.log | head -10 | sed 's/^/::error::/' || true
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              root = ET.parse(f).getroot()
              for tc in root.iter('testcase'):
                  for fl in list(tc.iter('failure')) + list(tc.iter('error')):
                      msg = (fl.get('message') or fl.text or '')[:600].replace('\n', ' ')
                      print(f"::error title={tc.get('name')}::{msg}")
              for so in root.iter('system-out'):
                  for line in (so.text or '').splitlines():
                      if line.startswith('STAT'):
                          print(f"::notice::{line}")
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: 360PhotoCap-v${{ steps.ver.outputs.name }}
          path: dist/360PhotoCap-v${{ steps.ver.outputs.name }}.apk
      - name: Release
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: v${{ steps.ver.outputs.name }}
          body: ${{ github.event.head_commit.message }}
          files: |
            dist/360PhotoCap-v${{ steps.ver.outputs.name }}.apk
            dist/360PhotoCap.apk
